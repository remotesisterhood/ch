<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="description" content="Dein Feedback zur Testbox in 3 Minuten, mit deinem Testerinnen-Vorteil am Ende.">
<meta property="og:type" content="website">
<meta property="og:title" content="Wie war deine Testbox? | Remote Sisterhood">
<meta property="og:description" content="Dein Feedback zur Testbox in 3 Minuten, mit deinem Testerinnen-Vorteil am Ende.">
<meta property="og:locale" content="de_CH">
<title>Wie war deine Testbox? | Remote Sisterhood</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Lato:wght@400;700&family=Dancing+Script:wght@600&display=swap">
<style>
/* Layout: one calm column, one step per card, products as rating rows */
:root{color-scheme:light;
  --bg:#f6f5ef; --surface:#ffffff; --ink:#24302a; --muted:#5f6b63; --line:#dcdfd3;
  --aloe:#3f6b4f; --aloe-soft:#e3ece2; --gold:#a8833c; --gold-soft:#f4ecdc; --warn:#8a4b2b;
  --display:"Playfair Display",Georgia,"Times New Roman",serif;
  --body:"Lato","Helvetica Neue",Arial,sans-serif;
  --script:"Dancing Script","Brush Script MT",cursive;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#161b18; --surface:#1f2622; --ink:#e9ece4; --muted:#a6b0a7; --line:#323b35;
  --aloe:#8fbf98; --aloe-soft:#25342a; --gold:#d6b26a; --gold-soft:#332c1f; --warn:#e3a27f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161b18; --surface:#1f2622; --ink:#e9ece4; --muted:#a6b0a7; --line:#323b35;
  --aloe:#8fbf98; --aloe-soft:#25342a; --gold:#d6b26a; --gold-soft:#332c1f; --warn:#e3a27f; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;padding-inline:16px;padding-block:28px 48px}
.wrap{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
header{display:flex;flex-direction:column;gap:6px}
.kicker{font-family:var(--script);color:var(--gold);font-size:1.5rem;line-height:1}
h1{font-family:var(--display);font-weight:600;font-size:clamp(1.7rem,5vw,2.3rem);line-height:1.15;margin:0;text-wrap:balance}
.lead{color:var(--muted);margin:0;max-width:60ch}
.progress{display:grid;gap:4px}
.progress span{height:6px;border-radius:6px 0 6px 0;background:var(--line);transition:background .25s}
.progress span.on{background:var(--aloe)}
.step-label{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 20px;display:flex;flex-direction:column;gap:16px}
.card h2{font-family:var(--display);font-weight:500;font-size:1.35rem;line-height:1.25;margin:0;text-wrap:balance}
.hint{color:var(--muted);font-size:.9rem;margin:-8px 0 0}
.opts{display:grid;gap:8px}
.opts.two{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.opt{display:flex;align-items:center;gap:12px;padding:11px 14px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--surface);transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--aloe)}
.opt input{accent-color:var(--aloe);width:18px;height:18px;flex:none;margin:0}
.opt:has(input:checked){border-color:var(--aloe);background:var(--aloe-soft)}
.opt:has(input:focus-visible){outline:2px solid var(--gold);outline-offset:2px}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale label{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 4px;border:1px solid var(--line);border-radius:10px;cursor:pointer;font-variant-numeric:tabular-nums;font-weight:700;transition:border-color .15s,background .15s}
.scale input{position:absolute;opacity:0;pointer-events:none}
.scale label:has(input:checked){background:var(--aloe);border-color:var(--aloe);color:var(--surface)}
.scale label:has(input:focus-visible){outline:2px solid var(--gold);outline-offset:2px}
.scale-ends{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);margin-top:-8px}
.prod{border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:10px}
.prod:first-of-type{border-top:0;padding-top:0}
.prod h3{margin:0;font-size:1.02rem}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips label{padding:7px 12px;border:1px solid var(--line);border-radius:999px;cursor:pointer;font-size:.88rem}
.chips input{position:absolute;opacity:0;pointer-events:none}
.chips label:has(input:checked){background:var(--aloe-soft);border-color:var(--aloe);color:var(--aloe);font-weight:700}
.chips label:has(input:focus-visible){outline:2px solid var(--gold);outline-offset:2px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;font-size:.92rem}
.field input,.field select,.field textarea{font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);width:100%}
.field textarea{min-height:90px;resize:vertical}
.field :focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.perk{background:var(--gold-soft);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.perk strong{font-family:var(--display);font-weight:500;font-size:1.1rem}
.ref{border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px}
.ref-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:480px){.ref-row{grid-template-columns:1fr}}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:.9rem;color:var(--muted)}
.consent input{accent-color:var(--aloe);width:18px;height:18px;margin-top:3px;flex:none}
.nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
button{font:inherit;font-weight:700;border-radius:999px;padding:12px 22px;cursor:pointer;border:1px solid var(--aloe)}
.primary{background:var(--aloe);color:var(--surface)}
.ghost{background:transparent;color:var(--aloe)}
.link{background:none;border:0;padding:0;color:var(--aloe);text-decoration:underline;font-weight:700;align-self:flex-start}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.err{color:var(--warn);font-size:.9rem;margin:0}
.msgbox{white-space:pre-wrap;word-break:break-word;font-size:.85rem;background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:12px;color:var(--muted);max-height:260px;overflow:auto}
.send{display:flex;flex-wrap:wrap;gap:10px}
.send a{display:inline-flex;text-decoration:none}
.note{font-size:.82rem;color:var(--muted);margin:0}
.fine{font-size:.78rem;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <span class="kicker">Remote Sisterhood</span>
    <h1 id="hello">Wie war deine Testbox?</h1>
    <p class="lead">Danke, dass du dir Zeit für die Produkte genommen hast. Dein ehrliches Feedback hilft mir sehr, auch wenn etwas nicht gepasst hat. Es dauert etwa 3 Minuten.</p>
  </header>
  <div class="progress" id="progress" aria-hidden="true"></div>
  <div class="step-label" id="stepLabel"></div>
  <form id="f" class="card" novalidate></form>
  <p class="fine">Deine Angaben gehen nur an Sabine Kaya, Remote Sisterhood, und werden nicht weitergegeben.</p>
</div>

<script>
const SABINE_WHATSAPP = "41768163836";
const SABINE_DISPLAY = "+41 76 816 38 36";
const QUIZ_URL = "https://remotesisterhood.ch/testbox/";

/* Dieselben Produkt-Kürzel wie in der Auswertung */
const PRODUCTS = {
  shampoo:"Aloe-Jojoba Shampoo", conditioner:"Aloe-Jojoba Conditioner", hairoil:"Hair Oil",
  gelly:"Aloe Vera Gelly", propolis:"Aloe Propolis Creme", moist:"Logic Soothing Moisturizing Creme",
  toner:"Logic Toner", eye:"Eye Creme", renew:"Renewing Skin Creme", lotion:"Aloe Body Lotion",
  wash:"Aloe Body Wash", cooling:"Aloe Cooling Lotion", msm:"MSM Creme", first:"Aloe First Spray",
  soap:"Aloe Liquid Soap", bright:"Forever Bright Zahngel"
};
const KEEP = [["ja","Möchte ich behalten"],["vielleicht","Vielleicht"],["nein","Eher nicht"],["offen","Noch nicht getestet"]];

/* Personalisierung aus dem Link: ?n=Vorname&p=gelly.lotion.wash */
let params; try{ params = new URLSearchParams(location.search); }catch(e){ params = new URLSearchParams(""); }
const preName = (params.get("n")||"").slice(0,40);
const preProds = (params.get("p")||"").split(".").filter(id=>PRODUCTS[id]);
const S = { name:preName, prods:preProds.slice(), overall:"", rate:{}, keep:{}, fav:"", comment:"", perk:"", story:"", refs:[{},{},{}] };

const STEPS = [];
if(!preProds.length) STEPS.push("pick");
STEPS.push("overall","products","fav","perk","refs","finish");

if(preName) document.getElementById("hello").textContent = `Hallo ${preName}, wie war deine Testbox?`;
const form = document.getElementById("f"), prog = document.getElementById("progress");
prog.style.gridTemplateColumns = `repeat(${STEPS.length},1fr)`;
prog.innerHTML = STEPS.map(()=>"<span></span>").join("");
let step = 0;

function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function scale(name,val,ends){
  return `<div class="scale" role="radiogroup">${[1,2,3,4,5].map(n=>`<label for="${name}-${n}"><input type="radio" name="${name}" id="${name}-${n}" value="${n}" ${String(val)===String(n)?"checked":""}>${n}</label>`).join("")}</div>
  <div class="scale-ends"><span>${ends[0]}</span><span>${ends[1]}</span></div>`;
}

const VIEW = {
  pick:()=>`<h2>Welche Produkte waren in deiner Box?</h2><p class="hint">Bitte alle anhaken, die du bekommen hast.</p>
    <div class="opts two">${Object.entries(PRODUCTS).map(([id,n])=>`<label class="opt" for="pk-${id}"><input type="checkbox" id="pk-${id}" value="${id}" ${S.prods.includes(id)?"checked":""}><span>${esc(n)}</span></label>`).join("")}</div>`,
  overall:()=>`<h2>Wie gefällt dir deine Testbox insgesamt?</h2>${scale("overall",S.overall,["gar nicht","begeistert"])}`,
  products:()=>`<h2>Wie fandest du die einzelnen Produkte?</h2><p class="hint">Bewerte jedes Produkt von 1 bis 5 und sag mir, ob es in deinem Alltag einen Platz bekommen soll.</p>
    ${S.prods.map(id=>`<div class="prod"><h3>${esc(PRODUCTS[id])}</h3>${scale("r-"+id,S.rate[id],["gefällt mir nicht","liebe ich"])}
      <div class="chips">${KEEP.map(([v,l])=>`<label for="k-${id}-${v}"><input type="radio" name="k-${id}" id="k-${id}-${v}" value="${v}" ${S.keep[id]===v?"checked":""}>${l}</label>`).join("")}</div></div>`).join("")}`,
  fav:()=>`<h2>Dein Lieblingsprodukt und deine Gedanken</h2>
    <div class="field"><label for="fav">Welches Produkt hat dich am meisten überrascht oder begeistert?</label>
      <select id="fav"><option value="">Bitte wählen</option>${S.prods.map(id=>`<option value="${id}" ${S.fav===id?"selected":""}>${esc(PRODUCTS[id])}</option>`).join("")}<option value="keins" ${S.fav==="keins"?"selected":""}>Keines so richtig</option></select></div>
    <div class="field"><label for="comment">Was möchtest du mir noch sagen? (freiwillig)</label>
      <textarea id="comment" placeholder="Was hat dir gefallen, was hat dich gestört, was hast du gespürt?">${esc(S.comment)}</textarea></div>`,
  perk:()=>`<h2>Dein Testerinnen-Vorteil</h2>
    <div class="perk"><strong>Als Dankeschön für deinen Test</strong><span>Du bekommst einmalig <b>20 % Rabatt</b> auf deine nächste Bestellung. Danach erhältst du als Stammkundin dauerhaft <b>10 % Treuerabatt</b>.</span></div>
    <p class="hint" style="margin:0">Ganz ohne Verpflichtung: Wie möchtest du es handhaben?</p>
    <div class="opts">${[["angebot","Schick mir gern eine Übersicht mit meinem Rabatt für die Produkte, die ich behalten möchte"],["spaeter","Ich melde mich selbst, wenn ich nachbestellen möchte"],["nein","Im Moment nicht, danke"]].map(([v,l])=>`<label class="opt" for="perk-${v}"><input type="radio" name="perk" id="perk-${v}" value="${v}" ${S.perk===v?"checked":""}><span>${l}</span></label>`).join("")}</div>`,
  refs:()=>`<h2>Wem in deinem Umfeld würde eine Testbox auch Freude machen?</h2>
    <p class="hint">Freundin, Schwester, Mama, Kollegin? Ich freue mich sehr über jede Empfehlung. Komplett freiwillig, du kannst diesen Schritt auch überspringen.</p>
    ${S.refs.map((r,i)=>`<div class="ref">
      <div class="ref-row">
        <div class="field"><label for="rn-${i}">Vorname</label><input id="rn-${i}" value="${esc(r.n||"")}"></div>
        <div class="field"><label for="rr-${i}">Sie ist meine …</label><select id="rr-${i}">${["","Freundin","Schwester","Mama","Tochter","Tante","Kollegin","Nachbarin","Bekannte"].map(o=>`<option ${r.r===o?"selected":""} value="${o}">${o||"Bitte wählen"}</option>`).join("")}</select></div>
      </div>
      <div class="field"><label for="rt-${i}">Ihre Handynummer (freiwillig)</label><input id="rt-${i}" type="tel" inputmode="tel" value="${esc(r.t||"")}" placeholder="Nur, wenn sie einverstanden ist"></div>
      <label class="consent" for="rc-${i}"><input type="checkbox" id="rc-${i}" ${r.ok?"checked":""}> Sie weiss Bescheid und freut sich, wenn Sabine sich bei ihr meldet.</label>
    </div>`).join("")}
    <p class="note">Lieber selbst weitergeben? Hier ist der Link zum Testbox-Quiz: <strong style="user-select:all">${QUIZ_URL}</strong></p>`,
  finish:()=>`<h2>Fast geschafft</h2>
    <div class="field"><label for="name">Dein Vorname</label><input id="name" autocomplete="given-name" value="${esc(S.name)}"></div>
    <div class="opts">${[["ja","Du darfst mein Feedback mit meinem Vornamen als Erfahrungsbericht teilen"],["anonym","Gern teilen, aber ohne Namen"],["nein","Bitte nur für dich"]].map(([v,l])=>`<label class="opt" for="st-${v}"><input type="radio" name="story" id="st-${v}" value="${v}" ${S.story===v?"checked":""}><span>${l}</span></label>`).join("")}</div>`
};

function render(){
  const k = STEPS[step];
  [...prog.children].forEach((s,i)=>s.classList.toggle("on",i<=step));
  document.getElementById("stepLabel").textContent = `Schritt ${step+1} von ${STEPS.length}`;
  form.innerHTML = VIEW[k]() + `<p class="err" id="err" hidden></p><div class="nav">
    <button type="button" class="ghost" id="back" ${step===0?"disabled":""}>Zurück</button>
    <button type="submit" class="primary">${k==="finish"?"Feedback absenden":k==="refs"?"Weiter oder überspringen":"Weiter"}</button></div>`;
  document.getElementById("back").onclick=()=>{ save(false); step--; render(); };
}
const val = n => (form.querySelector(`input[name="${n}"]:checked`)||{}).value || "";
function fail(t){ const e=document.getElementById("err"); e.textContent=t; e.hidden=false; return false; }

function save(validate){
  const k = STEPS[step];
  if(k==="pick"){ S.prods=[...form.querySelectorAll("input:checked")].map(i=>i.value); if(validate&&!S.prods.length) return fail("Bitte hake mindestens ein Produkt an."); }
  if(k==="overall"){ S.overall=val("overall"); if(validate&&!S.overall) return fail("Bitte wähle eine Zahl von 1 bis 5."); }
  if(k==="products"){
    S.prods.forEach(id=>{ S.rate[id]=val("r-"+id); S.keep[id]=val("k-"+id); });
    if(validate && S.prods.some(id=>!S.rate[id] && S.keep[id]!=="offen")) return fail("Bitte bewerte jedes Produkt. Hast du eines noch nicht getestet, wähle «Noch nicht getestet».");
  }
  if(k==="fav"){ S.fav=document.getElementById("fav").value; S.comment=document.getElementById("comment").value.trim(); }
  if(k==="perk"){ S.perk=val("perk"); if(validate&&!S.perk) return fail("Bitte wähle eine Antwort."); }
  if(k==="refs"){
    S.refs = S.refs.map((_,i)=>({n:document.getElementById("rn-"+i).value.trim(), r:document.getElementById("rr-"+i).value,
      t:document.getElementById("rt-"+i).value.trim(), ok:document.getElementById("rc-"+i).checked}));
    if(validate && S.refs.some(r=>r.t && !r.ok)) return fail("Bitte gib eine Nummer nur an, wenn die Person Bescheid weiss, und hake das Kästchen an. Sonst lass das Nummernfeld leer.");
  }
  if(k==="finish"){ S.name=document.getElementById("name").value.trim(); S.story=val("story");
    if(validate&&!S.name) return fail("Bitte gib deinen Vornamen an."); if(validate&&!S.story) return fail("Bitte wähle eine Antwort."); }
  return true;
}

function finish(){
  const keepL = Object.fromEntries(KEEP);
  const perkL = {angebot:"Ja, bitte Übersicht mit Rabatt schicken",spaeter:"Meldet sich selbst",nein:"Im Moment nicht"};
  const storyL = {ja:"Ja, mit Vornamen",anonym:"Ja, ohne Namen",nein:"Nein, nur für Sabine"};
  const prodLines = S.prods.map(id=>`- ${PRODUCTS[id]}: ${S.rate[id]?S.rate[id]+" von 5":"–"}, ${keepL[S.keep[id]]||"keine Angabe"}`);
  const keepList = S.prods.filter(id=>S.keep[id]==="ja").map(id=>PRODUCTS[id]);
  const refs = S.refs.filter(r=>r.n).map(r=>`- ${r.n}${r.r?" ("+r.r+")":""}${r.t&&r.ok?", Nummer: "+r.t+", weiss Bescheid":", ohne Nummer"}`);
  const msg = [
    `Hallo Sabine, hier ist mein Feedback zur Testbox.`, ``,
    `Name: ${S.name}`, `Gesamteindruck: ${S.overall} von 5`, ``,
    `Produkte:`, ...prodLines, ``,
    `Möchte ich behalten: ${keepList.length?keepList.join(", "):"noch keins"}`,
    `Lieblingsprodukt: ${S.fav==="keins"?"keines so richtig":(PRODUCTS[S.fav]||"keine Angabe")}`,
    S.comment?`Kommentar: ${S.comment}`:null, ``,
    `Testerinnen-Vorteil: ${perkL[S.perk]}`,
    `Erfahrungsbericht: ${storyL[S.story]}`,
    refs.length?`\nEmpfehlungen:\n${refs.join("\n")}`:`Empfehlungen: keine`
  ].filter(l=>l!==null).join("\n");
  const wa = `https://wa.me/${SABINE_WHATSAPP}?text=${encodeURIComponent(msg)}`;
  [...prog.children].forEach(s=>s.classList.add("on"));
  document.getElementById("stepLabel").textContent = "Fertig";
  form.innerHTML = `<h2>Danke, ${esc(S.name)}! Ein Klick noch.</h2>
    <p style="margin:0">Schick mir dein Feedback per WhatsApp. Ich lese jede Rückmeldung persönlich${S.perk==="angebot"?" und schicke dir deine Übersicht mit dem Testerinnen-Rabatt":""}.</p>
    <div class="send"><a href="${wa}" target="_blank" rel="noopener"><button type="button" class="primary">Per WhatsApp an Sabine senden</button></a>
    <button type="button" class="ghost" id="copy">Nachricht kopieren</button></div>
    <p class="note">Falls sich WhatsApp nicht öffnet: Nachricht kopieren und an <strong style="user-select:all">${SABINE_DISPLAY}</strong> senden.</p>
    <div class="msgbox" id="msg">${esc(msg)}</div><p class="note" id="copied" hidden>Kopiert. Füge die Nachricht jetzt in WhatsApp ein.</p>`;
  document.getElementById("copy").onclick = async ()=>{
    try{ await navigator.clipboard.writeText(msg); document.getElementById("copied").hidden=false; }
    catch(e){ const r=document.createRange(); r.selectNodeContents(document.getElementById("msg")); const s=getSelection(); s.removeAllRanges(); s.addRange(r); }
  };
}

form.addEventListener("submit",e=>{
  e.preventDefault();
  if(!save(true)) return;
  if(step<STEPS.length-1){ step++; render(); window.scrollTo({top:0,behavior:"smooth"}); } else finish();
});
render();
</script>

</body>
</html>
